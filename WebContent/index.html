<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Inspector</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 460px;
        }
        .header { text-align: center; margin-bottom: 28px; }
        .icon { font-size: 42px; display: block; margin-bottom: 10px; }
        h1 { color: #1a1a2e; font-size: 22px; font-weight: 700; }
        .subtitle { color: #666; font-size: 13px; margin-top: 4px; }
        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #0f3460;
            border-radius: 0 8px 8px 0;
            padding: 10px 14px;
            margin-bottom: 22px;
            font-size: 12px;
            color: #444;
        }
        .info-box strong { color: #0f3460; display: block; margin-bottom: 3px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; color: #333; margin-bottom: 6px; font-size: 14px; }
        input {
            width: 100%; padding: 12px 16px;
            border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 15px; outline: none;
            transition: border-color 0.2s; font-family: inherit;
        }
        input:focus { border-color: #0f3460; }
        .btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #0f3460, #533483);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            font-family: inherit; margin-top: 4px;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="icon">🍪</span>
            <h1>Cookie Inspector</h1>
            <p class="subtitle">Create and view browser cookies</p>
        </div>
        <div class="info-box">
            <strong>How it works</strong>
            Enter a cookie name and value below. The servlet will save it as a browser cookie (1-day max age) and then display ALL current cookies stored in your browser.
        </div>
        <form action="CookieServlet" method="post">
            <div class="form-group">
                <label for="cookieName">Cookie Name</label>
                <input type="text" id="cookieName" name="cookieName"
                       placeholder="e.g. username" required>
            </div>
            <div class="form-group">
                <label for="cookieValue">Cookie Value</label>
                <input type="text" id="cookieValue" name="cookieValue"
                       placeholder="e.g. Aqib" required>
            </div>
            <button type="submit" class="btn">🍪 Save Cookie &amp; View All</button>
        </form>
    </div>
</body>
</html>
